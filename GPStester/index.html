<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE GPS / WASM TELEMETRY</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{margin:0;background:#0c1117;color:#dce5ee;font-family:monospace}body{padding:16px}.app{width:min(1200px,100%);margin:auto;background:#151b21;border:1px solid #303a45;border-radius:12px;padding:18px;overflow:hidden}h1{text-align:center;color:#00ff78;font-size:20px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}button{border:1px solid #00ff78;background:#111820;color:#00ff78;border-radius:7px;padding:11px 16px;font-weight:700;cursor:pointer}button.active{background:#00ff78;color:#07120c}button.danger{background:#f0333a;color:white;border-color:#ff4242}button.secondary{border-color:#7c8b99;color:#dce5ee}.status{text-align:center;color:#8fa0af;font-size:12px;margin:10px}.main{display:grid;grid-template-columns:310px minmax(0,1fr);gap:14px}.telemetry{border:1px solid #303a45;border-radius:8px;overflow:hidden}.row{display:grid;grid-template-columns:105px 1fr;min-height:55px;border-bottom:1px solid #252e37}.label{padding:12px 10px;border-left:3px solid #00ff78;color:#9eabb7}.value{padding:12px 10px;font-weight:700;word-break:break-word}.na{color:#84919d}#map{width:100%;height:520px;min-height:360px;border:1px solid #303a45;border-radius:8px}.map-controls,.logs{margin-top:10px;border:1px solid #303a45;border-radius:8px;padding:12px}.map-controls h2,.logs-title{font-size:14px;color:#00ff78;margin:0 0 10px}.bounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.bounds label{font-size:11px;color:#9eabb7}.bounds input{width:100%;margin-top:4px;background:#0e141a;color:#dce5ee;border:1px solid #394550;border-radius:5px;padding:8px;font:inherit}.control-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}.checkbox{font-size:12px}.logs{background:#11171d}#log{height:170px;overflow:auto;white-space:pre-wrap;color:#8fa0af;font-size:11px;line-height:1.45}.note{margin-top:10px;color:#73818e;font-size:11px;line-height:1.5}@media(max-width:800px){.main{grid-template-columns:1fr}.bounds{grid-template-columns:repeat(2,1fr)}#map{height:430px}}@media(max-width:480px){.bounds{grid-template-columns:1fr}#map{height:360px}}</style></head><body><div class="app"><h1>LIVE GPS / WASM TELEMETRY</h1><div class="toolbar"><button type="button" id="modeNormal" class="mode active" data-mode="normal">通常</button><button type="button" id="modeAir" class="mode" data-mode="airplane">✈️ 飛行機</button><button type="button" id="modeTrain" class="mode" data-mode="train">🚆 電車</button></div><div class="toolbar"><button id="start">START TRACKING</button><button id="addr" class="secondary">UPDATE ADDRESS</button></div><div id="status" class="status">Ready / GPS waiting</div><div class="main"><div><div class="telemetry"><div class="row"><div class="label">緯度</div><div id="lat" class="value na">N/A</div></div><div class="row"><div class="label">経度</div><div id="lng" class="value na">N/A</div></div><div class="row"><div class="label">住所</div><div id="address" class="value na">N/A</div></div><div class="row"><div class="label">GPS高度</div><div id="alt" class="value na">N/A</div></div><div class="row"><div class="label">高度 ft</div><div id="altFt" class="value na">N/A</div></div><div class="row"><div class="label">向き</div><div id="heading" class="value na">N/A</div></div><div class="row"><div class="label">速度</div><div id="speed" class="value na">N/A</div></div><div class="row"><div class="label">GPS精度</div><div id="accuracy" class="value na">N/A</div></div><div class="row"><div class="label">情報源</div><div id="headingSource" class="value na">N/A</div></div><div class="row"><div class="label">更新時刻</div><div id="updated" class="value na">N/A</div></div></div><div class="note">GPS高度は端末/GNSSが返した値のみ表示します。端末によってはN/Aです。<br>向きはGPS進行方向を優先し、端末方位を補助使用します。</div></div><div><div id="map"></div><div class="map-controls"><h2>地図表示範囲</h2><div class="bounds"><label>北緯<input id="north" type="number" step="any" value="35"></label><label>南緯<input id="south" type="number" step="any" value="33"></label><label>西経<input id="west" type="number" step="any" value="130"></label><label>東経<input id="east" type="number" step="any" value="132"></label></div><div class="control-line"><button id="apply">範囲を適用</button><button id="locate" class="secondary">現在地へ移動</button><button id="clear" class="secondary">範囲指定解除</button><label class="checkbox"><input id="follow" type="checkbox"> GPS自動追従</label></div></div></div></div><div class="logs"><div class="logs-title">LIVE LOG</div><div id="log"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="./gps.js"></script></body></html>
